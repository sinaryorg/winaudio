[package]
name = "winaudio-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line tool for per-process Windows audio capture, monitoring, and volume control by SINARY™"
readme = "../../README.md"
keywords = ["windows", "audio", "wasapi", "loopback", "cli"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "winaudio"
path = "src/main.rs"

[dependencies]
winaudio-core = { path = "../winaudio-core" }
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
indicatif = "0.17"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
